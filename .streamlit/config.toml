[server]
enableStaticServing = true

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/Manrope-Variable.ttf"
weight = "200 800"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Medium.ttf"
weight = "500"
style = "normal"

[theme]
font = "Helvetica Neue, Suisse International, Neue Montreal, Manrope, sans-serif"
headingFont = "Manrope, Helvetica Neue, sans-serif"
codeFont = "IBM Plex Mono, monospace"
baseFontSize = 16
baseFontWeight = 400
codeFontSize = "0.875rem"
codeFontWeight = 400
headingFontWeights = [500, 500, 600, 600, 600, 600]
metricValueFontSize = "2.25rem"
metricValueFontWeight = 500
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2.5rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#222222"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#222222"
linkColor = "#222222"
codeTextColor = "#222222"
codeBackgroundColor = "#FFFFFF"
borderColor = "#222222"
redColor = "#222222"
orangeColor = "#222222"
yellowColor = "#222222"
greenColor = "#222222"
blueColor = "#222222"
violetColor = "#222222"
grayColor = "#222222"
dataframeBorderColor = "#222222"
dataframeHeaderBackgroundColor = "#F2F2F2"
dataframeHeaderTextColor = "#222222"

[theme.light.sidebar]
# Preserve contrast against both the dark sidebar and Streamlit's white primary-button text.
primaryColor = "#767676"
backgroundColor = "#222222"
secondaryBackgroundColor = "#2B2B2B"
textColor = "#FFFFFF"
linkColor = "#FFFFFF"
codeTextColor = "#FFFFFF"
codeBackgroundColor = "#2B2B2B"
borderColor = "#FFFFFF"
redColor = "#FFFFFF"
orangeColor = "#FFFFFF"
yellowColor = "#FFFFFF"
greenColor = "#FFFFFF"
blueColor = "#FFFFFF"
violetColor = "#FFFFFF"
grayColor = "#FFFFFF"
dataframeBorderColor = "#FFFFFF"
dataframeHeaderBackgroundColor = "#2B2B2B"
dataframeHeaderTextColor = "#FFFFFF"
paddingTop = "0.5rem"

[theme.dark]
primaryColor = "#17ABB5"
backgroundColor = "#222222"
secondaryBackgroundColor = "#2B2B2B"
textColor = "#FFFFFF"
linkColor = "#CFEFF0"
codeTextColor = "#EAF5F7"
codeBackgroundColor = "#2B2B2B"
borderColor = "#EAF5F7"
redColor = "#FFB4AB"
orangeColor = "#FDE68A"
greenColor = "#A7F3D0"
dataframeBorderColor = "#4B4F55"
dataframeHeaderBackgroundColor = "#2B2B2B"
dataframeHeaderTextColor = "#FFFFFF"

[theme.dark.sidebar]
primaryColor = "#17ABB5"
backgroundColor = "#2B2B2B"
secondaryBackgroundColor = "#333333"
textColor = "#FFFFFF"
linkColor = "#CFEFF0"
codeTextColor = "#EAF5F7"
codeBackgroundColor = "#333333"
borderColor = "#EAF5F7"
paddingTop = "0.5rem"
