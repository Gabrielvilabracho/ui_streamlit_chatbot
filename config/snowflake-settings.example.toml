[snowflake]
account = "replace-me"
user = "replace-me"
password = "replace-me"
warehouse = "SOFIA_RAG_WH"
database = "SOFIA"
schema = "KNOWLEDGE"
role = "SOFIA_RAG_APP"
search_service = "DOCUMENT_SEARCH"
content_column = "CHUNK"
id_column = "CHUNK_ID"
title_column = "TITLE"
uri_column = "SOURCE_URL"

[trulens]
enabled = false
app_name = "SOFIA_RAG"
app_version = "v1"

[trulens_evaluation]
dataset = "SOFIA.OBSERVABILITY.SOFIA_EVAL_QUESTIONS"
run = "replace-with-unique-run-name"
judge_model = "replace-with-enabled-cortex-model"
input_column = "QUESTION"
ground_truth_column = "EXPECTED_ANSWER"
metrics = "groundedness,context_relevance,answer_relevance,coherence"
