[snowflake]
account = "replace-me"
user = "replace-me"
password = "replace-me"
warehouse = "DATALAB_TEST_WH"
database = "DATALAB"
schema = "TEST"
role = "DATALAB_TEST_ADMIN"
search_service = "SOFIA_GENERAL_SEARCH"
content_column = "CHUNK"
id_column = "CHUNK_ID"
title_column = "TITLE"
uri_column = "SOURCE_URL"

[trulens]
enabled = false
app_name = "SOFIA_RAG"
app_version = "v1"

[trulens_evaluation]
dataset = "DATALAB.TEST.SOFIA_EVALUATION_CASES"
run = "replace-with-unique-run-name"
judge_model = "replace-with-enabled-cortex-model"
input_column = "QUESTION"
ground_truth_column = "EXPECTED_ANSWER"
metrics = "groundedness,context_relevance,answer_relevance,coherence"
